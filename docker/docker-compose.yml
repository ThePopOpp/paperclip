# Paperclip for Coolify — paperclip.channelcast.io
#
# Adapted from the upstream docker/docker-compose.yml. Three changes, each of
# which matters:
#
#   1. The upstream server service declares only seven env vars, so provider
#      keys and PAPERCLIP_ALLOWED_HOSTNAMES set in Coolify's UI would never
#      reach the container. They are declared here.
#   2. EXPOSURE is "private" upstream (LAN only). This instance is behind TLS
#      on a public domain, so it must be "public".
#   3. Upstream publishes Postgres on 5432 and the server on 3100, both on the
#      host. Removed — Traefik reaches the server on Coolify's internal
#      network, and publishing them would serve the app over plain HTTP on the
#      bare VPS IP, around the certificate.
#
# This file lives at docker/docker-compose.yml in the fork
# https://github.com/ThePopOpp/paperclip (branch master), because Coolify
# re-reads the compose from the repo on every deploy and discards anything
# typed into its "Docker compose content (raw)" box.
#
# Domain paperclip.channelcast.io -> service "server", port 3100.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      # context is "." and not ".." because Coolify runs compose with
      # --project-directory set to the repo root, and build contexts resolve
      # against that, not against this file's folder. Upstream uses ".."
      # because it expects you to run compose from inside docker/.
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped
    # No `init: true` here on purpose — the image makes tini PID 1 itself via
    # the Dockerfile ENTRYPOINT. pids_limit is the backstop: if something leaks
    # processes, this container hits its own ceiling and dies visibly rather
    # than starving the whole host of pids.
    pids_limit: 2048
    # expose, not ports: Traefik reaches this on Coolify's internal network.
    # Publishing it on the host would serve the app over plain HTTP on the
    # VPS IP, around the TLS certificate.
    expose:
      - "3100"
    environment:
      DATABASE_URL: "postgres://paperclip:${POSTGRES_PASSWORD}@db:5432/paperclip"
      PORT: "3100"
      HOST: "0.0.0.0"
      SERVE_UI: "true"
      PAPERCLIP_HOME: "/paperclip"

      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      # Internet-facing behind Traefik TLS. Upstream defaults to "private".
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "public"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:?set PAPERCLIP_PUBLIC_URL}"
      PAPERCLIP_ALLOWED_HOSTNAMES: "${PAPERCLIP_ALLOWED_HOSTNAMES:-}"

      # Refuses to start without this.
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}"
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: "${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:-}"

      # At least one is needed before any agent can actually run.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"

      PAPERCLIP_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
    volumes:
      # Database, secrets, agent workspaces and uploads.
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  paperclip-data:
